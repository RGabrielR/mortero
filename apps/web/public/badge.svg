<svg xmlns="http://www.w3.org/2000/svg" viewBox="88 80 336 336">
  <!-- Ícono chico de las notificaciones (Android lo muestra en la barra de estado).
       Tiene que ser una silueta de un solo color sobre fondo transparente: Android solo usa la forma. -->
