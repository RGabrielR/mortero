    <rect x="0" y="0" width="512" height="512" fill="#fff"/>
    <rect x="268" y="96" width="44" height="170" rx="22" transform="rotate(28 290 181)" fill="#000" stroke="#000" stroke-width="28"/>
  </mask>
  <g mask="url(#corte)" fill="#fff">
    <path d="M120 236h272c0 86-61 148-136 148S120 322 120 236z"/>
    <rect x="104" y="214" width="304" height="34" rx="17"/>
  </g>
  <rect x="268" y="96" width="44" height="170" rx="22" transform="rotate(28 290 181)" fill="#fff"/>
</svg>
